# Netlify Configuration
[build]
publish = "."

[build.processing]
skip_processing = false

[build.processing.html]
pretty_urls = true

# URL Redirects
# 내부 파일 비공개 — 빌드·작업용 스크립트와 메모가 사이트에 같이 올라가므로 404로 막는다 (리다이렉트는 위에서부터 먼저 맞는 규칙이 적용되니 맨 앞에 둔다)
[[redirects]]
from = "/scripts/*"
to = "/404.html"
status = 404
force = true

[[redirects]]
from = "/content/*"
to = "/404.html"
status = 404
force = true

[[redirects]]
from = "/work-status.md"
to = "/404.html"
status = 404
force = true

[[redirects]]
from = "/WORK-STATUS.md"
to = "/404.html"
status = 404
force = true

[[redirects]]
from = "/deploy.ps1"
to = "/404.html"
status = 404
force = true

[[redirects]]
from = "/package.json"
to = "/404.html"
status = 404
force = true

[[redirects]]
from = "/index.html"
to = "/"
status = 301

[[redirects]]
from = "/blog-list.html"
to = "/blog-list"
status = 301

[[redirects]]
from = "/recruit.html"
to = "/recruit"
status = 301

[[redirects]]
from = "/blog-post-*.html"
to = "/blog-post-:splat"
status = 301

[[redirects]]
from = "https://www.primeasset-realestate.co.kr/*"
to = "https://primeasset-realestate.co.kr/:splat"
status = 301
force = true
