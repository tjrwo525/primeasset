# Netlify Configuration
[build]
publish = "."
# 배포 직전 내부 파일(작업 스크립트·메모 등)을 배포 폴더에서 지운다. 로컬에서는 아무것도 지우지 않는다(scripts/strip-internal.mjs)
command = "node scripts/strip-internal.mjs . scripts content"

[build.processing]
skip_processing = false

[build.processing.html]
pretty_urls = true

# URL Redirects
[[redirects]]
from = "/index.html"
to = "/"
status = 301

[[redirects]]
from = "/blog-list.html"
to = "/blog-list"
status = 301

[[redirects]]
from = "/recruit.html"
to = "/recruit"
status = 301

[[redirects]]
from = "/blog-post-*.html"
to = "/blog-post-:splat"
status = 301

[[redirects]]
from = "https://www.primeasset-realestate.co.kr/*"
to = "https://primeasset-realestate.co.kr/:splat"
status = 301
force = true
